name: Reference Table Diffs

on:
  pull_request:

permissions:
  contents: read

jobs:
  table-diffs:
    name: Review Reference Table Changes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install xsref
        run: python -m pip install -e .

      - name: Generate table diff report
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          from xsref.tables import get_table_diffs, format_table_diffs

          base = subprocess.check_output(
              ["git", "merge-base", os.environ["BASE_SHA"], "HEAD"],
              text=True,
          ).strip()

          diffs = get_table_diffs(base, None)

          report = format_table_diffs(
              diffs, revision1=base, revision2=None
          )
          Path("table-diffs.md").write_text(report, encoding="utf-8")

          summary = format_table_diffs(
              diffs, revision1=base, revision2=None,
              max_bytes=900_000
          )

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(summary)
          PY

      - name: Upload complete report
        uses: actions/upload-artifact@v4
        with:
          name: reference-table-diffs
          path: table-diffs.md
