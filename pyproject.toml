[build-system]
requires = ["uv_build>=0.12.3,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
purelib = "src/xsref/tables"

[project]
name = "xsref"
version = "0.0.0"
license = { file = "LICENSE" }
maintainers = [
  { name = "xsf developers", email = "albert.steppi@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
  "mpmath",
  "numpy",
  "packaging",
  "polars",
  "pyarrow",
  "scipy",
]
readme = "README.md"

[dependency-groups]
test = ["pytest"]
