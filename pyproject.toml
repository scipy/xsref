[build-system]
requires = ["uv_build>=0.12.3,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
purelib = "src/xsref/tables"

[project]
name = "xsref"
version = "0.0.0"
license = { file = "LICENSE" }
maintainers = [
  { name = "xsf developers", email = "albert.steppi@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
  "mpmath",
  "numpy",
  "polars",
  "pyarrow",
  "scipy",
]
readme = "README.md"

[dependency-groups]
test = ["pytest"]
lint = ["ruff>=0.12.0"]

[tool.ruff]
# Mirrors SciPy's tools/linting/lint.toml. SciPy does not run `ruff format`
# or sort imports, so neither is enforced here.
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "UP", "PGH004", "B006", "B008", "B028", "ICN001", "RUF100"]
# E741: ambiguous variable names
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
# Generated C++ test code is kept on one line per statement.
"src/xsref/cpp_generation.py" = ["E501"]

[tool.ruff.lint.flake8-import-conventions.aliases]
numpy = "np"
